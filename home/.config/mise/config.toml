[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[bootstrap.macos.defaults]
".GlobalPreferences" = {
  # マウス軌道の早さを最速化
  "com.apple.mouse.scalling" = 2.5,
}
"com.apple.desktopservices" = {
  # ネットワークフォルダに .DS_Store を作らない
  DSDontWriteNetworkStores = true,
}
"com.apple.dock" = {
  # Dock の自動非表示を有効化
  autohide = true,
  # 最近使ったアプリケーションを Dock に表示しない
  show-recents = false,
}
"com.apple.finder" = {
  # Finder の拡張子を常に表示
  AppleShowAllExtensions = true,
  # Finder の隠しファイルを表示
  AppleShowAllFiles = true,
  # Finder の検索範囲を現在のフォルダに設定
  FXDefaultSearchScope = "SCcf",
  # Finder の拡張子変更時の警告を無効化
  FXEnableExtensionChangeWarning = false,
  # Finder の新規ウィンドウの表示先をホームに設定
  NewWindowTarget = "Home",
  # Finder のパスバーを表示
  ShowPathbar = true,
  # Finder のステータスバーを表示
  ShowStatusBar = true,
}
# メニューバーの時計
"com.apple.menuextra.clock" = {
  # 24時間表示を有効化
  Show24Hour = true,
}
# スクリーンキャプチャ
"com.apple.screencapture" = {
  # スクリーンショットの影を無効化
  disable-shadow = true,
  # スクリーンショットの保存先を変更
  location = "~/Documents/Screenshots",
  # スクリーンショットのサムネイルを無効化
  show-thumbnail = false,
}
# WindowManager
"com.apple.WindowManager" = {
  EnableStandardClickToShowDesktop = false,
}
NSGlobalDomain = {
  # 全てのファイル拡張子を表示
  AppleShowAllExtensions = true,
  # キーリピートの初期遅延を短くする
  InitialKeyRepeat = 15,
  # キーリピートの速度を速くする
  KeyRepeat = 2,
  # 自動の大文字変換を無効化
  NSAutomaticCapitalizationEnabled = false,
  # スマートダッシュ置換を無効化
  NSAutomaticDashSubstitutionEnabled = false,
  # スマートピリオド置換を無効化
  NSAutomaticPeriodSubstitutionEnabled = false,
  # スマート引用符置換を無効化
  NSAutomaticQuoteSubstitutionEnabled = false,
  # スペル自動修正を無効化
  NSAutomaticSpellingCorrectionEnabled = false,
  # スペル自動修正を無効化 (WebView)
  WebAutomaticSpellingCorrectionEnabled = false,
}

[bootstrap.packages]
# Commands
"brew:duckdb" = "latest"
"brew:starship" = "latest"
## Linter
"brew:shellcheck" = "latest"
# Casks
"brew-cask:claude-code" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zed" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/sheldon" = {}
"~/.config/starship.toml" = {}
"~/.config/zed" = {}
"~/.tmux.d" = {}
"~/.vim" = {}
"~/.vimrc" = {}
"~/.zprofle" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}
"~/.zsh.d" = {}

[settings]
dotfiles.root = "~/.dotfiles/home"
install_before = "7d"

[tools]
usage = "latest"
# Commands
bat = "latest"
fzf = "latest"
"github:peco/peco" = "latest"
jq = "latest"
just = "latest"
rg = "latest"
yq = "latest"
# Languages
go = "latest"
node = "24"
# Network tools
gcloud = "latest"
gh = "latest"
terraform = "latest"
# Plugin managers
sheldon = "latest"
# Package managers
pdm = "latest"
uv = "0.11"
# Release tools
goreleaser = "latest"
# Security tools
pinact = "latest"
zizmor = "latest"
