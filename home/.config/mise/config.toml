[settings]
dotfiles.root = "~/.dotfiles/home"
minimum_release_age = "7d"

[bootstrap.macos.defaults]
# ref: https://macos-defaults.com/

# dock
"com.apple.dock" = {
  # Icon size を36(px)に変更
  tilesize = 36,
  # Dock の自動非表示を有効化
  autohide = true,
  # Docker 自動非表示化アニメーション時間を0.5(秒)
  autohide-time-modifier = 0.5,
  # 最近使ったアプリケーションを Dock に表示しない
  show-recents = false,
  # アクティブなアプリケーションのみ表示する
  static-only = true,
}
# screencapture
"com.apple.screencapture" = {
  # スクリーンショットの影を無効化
  disable-shadow = true,
  # スクリーンショットの保存先を変更
  location = "~/Documents/Screenshots",
  # スクリーンショットのサムネイルを無効化
  show-thumbnail = false,
}
# finder
"com.apple.finder" = {
  # Finder の拡張子を常に表示
  AppleShowAllExtensions = true,
  # Finder の隠しファイルを表示
  AppleShowAllFiles = true,
  # Finder のパスバーを表示
  ShowPathbar = true,
  # Finder の検索範囲を現在のフォルダに設定
  FXDefaultSearchScope = "SCcf",
  # Finder の拡張子変更時の警告を無効化
  FXEnableExtensionChangeWarning = false,
  # Finder の新規ウィンドウの表示先をホームに設定
  NewWindowTarget = "Home",
  # Finder のステータスバーを表示
  ShowStatusBar = true,
}
# menuextra.clock
"com.apple.menuextra.clock" = {
  # 時計の24時間表示を有効化
  Show24Hour = true,
}
# desktopservices
"com.apple.desktopservices" = {
  # ネットワークフォルダに .DS_Store を作らない
  DSDontWriteNetworkStores = true,
}
# NSGlobalDomain
NSGlobalDomain = {
  # Finder
  # 全てのファイル拡張子を表示
  AppleShowAllExtensions = true,
  # Mouse
  # マウス軌道の早さを最速化
  "com.apple.mouse.scalling" = 1.5,
  # Keyboard
  # Tab/Shift+Tab でフォーカス移動を有効化
  AppleKeyboardUIMode = 2,
  # キーリピートの初期遅延を短くする
  InitialKeyRepeat = 15,
  # キーリピートの速度を速くする
  KeyRepeat = 2,
  # 自動の大文字変換を無効化
  NSAutomaticCapitalizationEnabled = false,
  # スマートダッシュ置換を無効化
  NSAutomaticDashSubstitutionEnabled = false,
  # スマートピリオド置換を無効化
  NSAutomaticPeriodSubstitutionEnabled = false,
  # スマート引用符置換を無効化
  NSAutomaticQuoteSubstitutionEnabled = false,
  # スペル自動修正を無効化
  NSAutomaticSpellingCorrectionEnabled = false,
  # スペル自動修正を無効化 (WebView)
  WebAutomaticSpellingCorrectionEnabled = false,
}
# Stage Manager
"com.apple.WindowManager" = {
  EnableStandardClickToShowDesktop = false,
}

[bootstrap.packages]
# Commands
"brew:bat" = "latest"
"brew:duckdb" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:herdr" = "latest"
"brew:jj" = "latest"
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:pinact" = "latest"
"brew:ripgrep" = "latest"
"brew:sheldon" = "latest"
"brew:starship" = "latest"
"brew:tmux" = "latest"
"brew:yq" = "latest"
"brew:zizmor" = "latest"
# Linters
"brew:checkmake" = "latest"
"brew:shellcheck" = "latest"
# Cask: GUI Applications
"brew-cask:google-chrome" = "latest"
"brew-cask:zed" = "latest"
# Cask: CLI Applications
"brew-cask:claude-code" = "latest"
# Cask: Fonts
"brew-cask:font-noto-nerd-font" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.claude/settings.json" = {}
"~/.config/git" = {}
"~/.config/gh" = {}
"~/.config/homebrew" = {}
"~/.config/jj" = {}
"~/.config/mise" = {}
"~/.config/sheldon" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/zed" = {}
"~/.tmux.d" = {}
"~/.vim" = {}
"~/.vimrc" = {}
"~/.zprofile" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}
"~/.zsh.d" = {}

[tools]
# Language
go = "latest"
node = "24"
# IaC tool
terraform = "latest"
# Package manager for Python
pdm = "latest"
uv = "latest"

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer 2>/dev/null || true"

[bootstrap.hooks.post-dotfiles]
run = [
  # Login github via gh command
  "gh auth status || gh auth login",
  # Download jetpack.vim
  "curl -fLo ~/.vim/pack/jetpack/opt/vim-jetpack/plugin/jetpack.vim --create-dirs https://raw.githubusercontent.com/tani/vim-jetpack/master/plugin/jetpack.vim",
  # Dump complition scripts to fpath
  "mise completion zsh > $HOME/.zsh.d/zfunc/_mise",
  "jj util completion zsh > $HOME/.zsh.d/zfunc/_jj",
  # Make symlinks for shell scripts
  "make -C $HOME/.dotfiles/scripts/shell link",
]

[bootstrap.hooks.post-tools]
run = [
  "mise exec -- gcloud auth login",
  "mise exec -- gcloud auth application-default login",
  "mise exec -- gcloud auth configure-docker",
]

[tasks.bootstrap]
run = "printf \"\\033[31m%s\\033[0m\\n\" \"Bootstrap processes are finished. please restart the OS.\""
