[settings]
dotfiles.root = "~/.dotfiles/home"
minimum_release_age = "3d"

[bootstrap.macos.defaults]
# ref: https://macos-defaults.com/

# dock
"com.apple.dock" = {
  # Icon size を36(px)に変更
  tilesize = 36,
  # Dock の自動非表示を有効化
  autohide = true,
  # Dock 自動非表示化アニメーション時間を0.5(秒)
  autohide-time-modifier = 0.5,
  # 最近使ったアプリケーションを Dock に表示しない
  show-recents = false,
  # アクティブなアプリケーションのみ表示する
  static-only = true,
  # 使用状況に基づいた操作スペースの並べ替え
  mru-spaces = false,
}
# screencapture
"com.apple.screencapture" = {
  # スクリーンショットの影を無効化
  disable-shadow = true,
  # スクリーンショットの保存先を変更
  location = "~/Documents/Screenshots",
  # スクリーンショットのサムネイルを無効化
  show-thumbnail = false,
}
# finder
"com.apple.finder" = {
  # Finder の隠しファイルを表示
  AppleShowAllFiles = true,
  # Finder のパスバーを表示
  ShowPathbar = true,
  # Finder の検索範囲を現在のフォルダに設定
  FXDefaultSearchScope = "SCcf",
  # Finder の拡張子変更時の警告を無効化
  FXEnableExtensionChangeWarning = false,
  # Finder の新規ウィンドウの表示先をホームに設定
  NewWindowTarget = "Home",
  # Finder のステータスバーを表示
  ShowStatusBar = true,
}
# menuextra.clock
"com.apple.menuextra.clock" = {
  # 時計の24時間表示を有効化
  Show24Hour = true,
}
# desktopservices
"com.apple.desktopservices" = {
  # ネットワークフォルダに .DS_Store を作らない
  DSDontWriteNetworkStores = true,
}
# NSGlobalDomain
NSGlobalDomain = {
  # Finder
  # 全てのファイル拡張子を表示
  AppleShowAllExtensions = true,
  # Mouse
  # マウス軌道の早さを最速化
  "com.apple.mouse.scaling" = 1.5,
  # Keyboard
  # Tab/Shift+Tab でフォーカス移動を有効化
  AppleKeyboardUIMode = 2,
  # キーリピートの初期遅延を短くする
  InitialKeyRepeat = 15,
  # キーリピートの速度を速くする
  KeyRepeat = 2,
  # 自動の大文字変換を無効化
  NSAutomaticCapitalizationEnabled = false,
  # スマートダッシュ置換を無効化
  NSAutomaticDashSubstitutionEnabled = false,
  # スマートピリオド置換を無効化
  NSAutomaticPeriodSubstitutionEnabled = false,
  # スマート引用符置換を無効化
  NSAutomaticQuoteSubstitutionEnabled = false,
  # スペル自動修正を無効化
  NSAutomaticSpellingCorrectionEnabled = false,
  # スペル自動修正を無効化 (WebView)
  WebAutomaticSpellingCorrectionEnabled = false,
}
# Stage Manager
"com.apple.WindowManager" = {
  EnableStandardClickToShowDesktop = false,
}

[bootstrap.packages]
# Commands
"brew:bat" = "latest"
"brew:duckdb" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:herdr" = "latest"
"brew:jj" = "latest"
"brew:jq" = "latest"
"brew:just" = "latest"
"brew:pinact" = "latest"
"brew:ripgrep" = "latest"
"brew:sheldon" = "latest"
"brew:starship" = "latest"
"brew:tmux" = "latest"
"brew:yq" = "latest"
"brew:zizmor" = "latest"
"brew:zoxide" = "latest"
# Linters
"brew:checkmake" = "latest"
"brew:shellcheck" = "latest"
# Cask: GUI Applications
"brew-cask:1password-cli" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:emacs-app" = "latest"
"brew-cask:git-credential-manager" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zed" = "latest"
# Cask: CLI Applications
"brew-cask:claude-code" = "latest"
"brew-cask:gcloud-cli" = "latest"
# Cask: Fonts
"brew-cask:font-cica" = "latest"
"brew-cask:font-noto-nerd-font" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.claude/settings.json" = {}
"~/.config/git" = {}
"~/.config/gh" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/jj" = {}
"~/.config/mise" = {}
"~/.config/sheldon" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/zed" = {}
"~/.ssh/config" = {}
"~/.tmux.d" = {}
"~/.vim" = {}
"~/.vimrc" = {}
"~/.zprofile" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}
"~/.zsh.d" = {}

[tools]
# Language
go = "latest"
node = "latest"
# IaC tool
terraform = "latest"
# Package manager for Python
pdm = "latest"
uv = "latest"

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer 2>/dev/null || true"

# Login github via gh command (before cloning the private repository)
[bootstrap.hooks.pre-repos]
run = "gh auth status || gh auth login"

# Work-specific dotfiles from the private repository, skipped where it is not
# accessible. This runs after repos rather than after dotfiles, because its
# `make install` runs `mise dotfiles apply`, which fires post-dotfiles again.
[bootstrap.hooks.post-repos]
run = """
P="$HOME/projects/github.com/shkumagai/dotfiles-private"
if gh repo view shkumagai/dotfiles-private >/dev/null 2>&1; then
  [ -d "$P" ] || gh repo clone shkumagai/dotfiles-private "$P"
  make -C "$P" install
else
  echo "skip dotfiles-private: repository is not accessible"
fi
"""

[bootstrap.hooks.post-dotfiles]
run = [
  # Download jetpack.vim
  "curl -fLo ~/.vim/pack/jetpack/opt/vim-jetpack/plugin/jetpack.vim --create-dirs https://raw.githubusercontent.com/tani/vim-jetpack/master/plugin/jetpack.vim",
  # Dump complition scripts to fpath
  "mise completion zsh > $HOME/.zsh.d/zfunc/_mise",
  "jj util completion zsh > $HOME/.zsh.d/zfunc/_jj",
  "herdr completion zsh > $HOME/.zsh.d/zfunc/_herdr",
  # Generate the herdr hook for Claude Code (~/.claude/hooks/herdr-agent-state.sh).
  # herdr owns the script and its entry in ~/.claude/settings.json; it is idempotent.
  "herdr integration install claude",
  # Make symlinks for shell scripts
  "make -C $HOME/.dotfiles/scripts/shell link",
]

[bootstrap.hooks.post-tools]
run = [
  "mise exec -- gcloud auth login",
  "mise exec -- gcloud auth application-default login",
  "mise exec -- gcloud auth configure-docker",
]

# Machine prerequisites that bootstrap cannot set up by itself.
# Run with `mise doctor project` (or `make doctor`).
[doctor.checks."gh:auth"]
description = "gh is logged in to github.com"
run = "gh auth status --hostname github.com"
hint = "Run `gh auth login`."

[doctor.checks."ssh:key"]
description = "The SSH key for GitHub exists"
run = "test -f ~/.ssh/id_ed25519"
hint = "Copy the key to ~/.ssh/id_ed25519, or create one with `ssh-keygen -t ed25519`."

[doctor.checks."ssh:github"]
description = "SSH authentication to github.com works"
run = "test -f ~/.ssh/id_ed25519 && ssh -T -o BatchMode=yes git@github.com 2>&1 | grep -q 'successfully authenticated'"
hint = "Fix ssh:key first if it fails, then register ~/.ssh/id_ed25519.pub at https://github.com/settings/keys."

[doctor.checks."dotfiles-private"]
description = "The private dotfiles are registered with mise"
run = "test -L ~/.config/mise/conf.d/private.toml"
hint = "Run `make -C ~/.dotfiles repos` (needs a gh account that can see shkumagai/dotfiles-private)."

[tasks.bootstrap]
run = "printf \"\\033[31m%s\\033[0m\\n\" \"Bootstrap processes are finished. please restart the OS.\""
