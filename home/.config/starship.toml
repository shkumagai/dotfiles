# Get editor completions base on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a black line between shell prompts
add_newline = false
format = """$username$hostname $character"""
# `$all` だと使わない言語・クラウドのモジュールまでプロンプトごとに動き、外部コマンドの待ちで遅くなるため、使うものだけを `$all` と同じ順に並べる（2026-11-25）
right_format = """\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$package\
$golang\
$nodejs\
$python\
$rust\
$terraform\
$gcloud\
$mise\
$cmd_duration\
$jobs\
"""
# command_timeout = 1500
continuation_prompt = '[❯❯❯](fg:white)'

# Replace the '>' (\u276F) symbol in the prompt with ''
[character]
# Ansi: 45,69,62
success_symbol = '[❯](fg:#00d7ff)[❯](fg:#5f87ff)[❯](fg:#5f5fd7)'
# Ansi: 225,170,164
error_symbol = '[❯](fg:#ffd7ff)[❯](fg:#d75fd7)[❯](fg:#d700d7)'

# user@host on the left (both are shown only over SSH or as root by default)
[username]
format = '[$user]($style)'

[hostname]
format = '[@$hostname]($style)'

[package]
disabled = true

[directory]
truncation_length = 8
truncation_symbol = '.../'

[cmd_duration]
show_milliseconds = true
format = '[$duration]($style)'

[gcloud]
symbol = ''
format = '[$symbol $account(@$domain)(\($project\))]($style) '
# style = 'bold yellow'

[gcloud.region_aliases]
us-central1 = 'uc1'
asia-northeast1 = 'ans1'

[gcloud.project_aliases]
service-vis-asq-v2-prod = 'prd'
service-vis-asq-v2-stg = 'stg'
service-vis-asq-v2-uat = 'uat'
service-vis-asq-v2-sandbox = 'sbx'
private-shoji-kumagai-01 = 'dev'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

# プロンプトごとに `mise doctor` を実行し、command_timeout を超えて `mise unhealthy` と誤表示するため無効にする（2026-11-24）
[mise]
disabled = true

[nodejs]
format = '[$symbol($version)]($style) '

[python]
# 既定の python → python3 → python2 を順に試すと、mise の shim 経由で 3 回実行して遅いため、python3 だけにする（2026-11-25）
python_binary = ['python3']
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version})( \(${virtualenv}\))]($style) '
