# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

[templates]
# -m -p: 読み込むたびに precmd のフック（mise の hook-env など）とプロンプトの描き直し（starship）が走らないようにする（2026-11-25）
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer -mp source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.colors]
inline = '''
autoload -Uz colors
colors
'''

[plugins.compinit]
inline = '''
fpath=(~/.zsh.d/zfunc ${fpath})
autoload -Uz compinit
_zcompdump="${XDG_CACHE_HOME}/zsh/.zcompdump-${ZSH_VERSION}"
mkdir -p "${_zcompdump:h}"

zsh-defer compinit -d "${_zcompdump}"
'''

# 起動ごとに starship を exec すると止まることがあるため、`starship init zsh` の出力を ${XDG_CACHE_HOME}/zsh/starship-init.zsh にキャッシュして読む（2026-11-27）
# 作り直すのは、キャッシュが無いとき、starship の実体（Homebrew はボトルの mtime を保つので、実体のパスを 1 行目に記録して比べる）が変わったとき、実体か starship.toml がキャッシュより新しいときだけ。作り直したいときは、キャッシュのファイルを消す
# init の出力の `PROMPT2="$(starship prompt --continuation)"` も起動ごとに starship を exec するため、書き出すときにその場で 1 回実行して値の代入に置き換える。値は starship.toml の continuation_prompt で決まるので、starship.toml を変えたら作り直す（2026-11-27）
# 置き換える行が見つからない（starship の版が変わって出力の形が変わったなど）か、値を取れなかったときは、置き換えずにそのまま書き出す
# 一時ファイルに書いてから zf_mv で置き換え、書き出しに失敗したら今までどおり eval する（.zshenv の Homebrew、.zshrc の sheldon と同じ形）
[plugins.starship]
inline = '''
if command -v starship &> /dev/null; then
  __starship="${commands[starship]}"
  __starship_real="${__starship:A}"
  __starship_cache="${XDG_CACHE_HOME}/zsh/starship-init.zsh"
  __starship_head=
  [[ -r "${__starship_cache}" ]] && IFS= read -r __starship_head < "${__starship_cache}"
  # starship は XDG_CONFIG_HOME を見ず、STARSHIP_CONFIG か ~/.config/starship.toml を読む
  if [[ "${__starship_head}" != "# ${__starship_real}" \
    || "${__starship_real}" -nt "${__starship_cache}" \
    || "${STARSHIP_CONFIG:-${HOME}/.config/starship.toml}" -nt "${__starship_cache}" ]]; then
    __starship_lines=()
    if __starship_init="$("${__starship}" init zsh 2>/dev/null)"; then
      __starship_lines=("${(@f)__starship_init}")
      for (( __starship_i = 1; __starship_i <= $#__starship_lines; __starship_i++ )); do
        [[ "${__starship_lines[__starship_i]}" == 'PROMPT2="$('*' prompt --continuation)"' ]] || continue
        # source したときは init の中で STARSHIP_SHELL=zsh になっている。エスケープを zsh のプロンプト用の印で囲ませるため、ここでも渡す
        if __starship_prompt2="$(STARSHIP_SHELL=zsh "${__starship}" prompt --continuation 2>/dev/null)"; then
          __starship_lines[__starship_i]="PROMPT2=${(q+)__starship_prompt2}"
        fi
        break
      done
    fi
    if (( $#__starship_lines )) \
      && zmodload -F zsh/files b:zf_mkdir b:zf_mv b:zf_rm 2>/dev/null \
      && { [[ -d "${__starship_cache:h}" ]] || zf_mkdir -p "${__starship_cache:h}"; } 2>/dev/null \
      && print -rl -- "# ${__starship_real}" "${__starship_lines[@]}" >| "${__starship_cache}.$$" 2>/dev/null \
      && zf_mv -f "${__starship_cache}.$$" "${__starship_cache}" 2>/dev/null; then
      :
    else
      zf_rm -f "${__starship_cache}.$$" 2>/dev/null
      __starship_cache=
    fi
  fi
  if [[ -n "${__starship_cache}" ]]; then
    source "${__starship_cache}"
  else
    eval "$(starship init zsh)"
  fi
  unset __starship __starship_real __starship_cache __starship_head __starship_init __starship_lines __starship_i __starship_prompt2
fi
'''

# 起動ごとの外部コマンドがときどき止まるため、fzf・gcloud・fzf-git・zoxide の初期化はプロンプトを出したあとに zsh-defer で行う（2026-11-25）
# zsh-defer は登録した順に実行するので、compinit → fzf → gcloud → fzf-git → zoxide の順になる
[plugins.fzf]
inline = '''
if command -v fzf &> /dev/null; then
  zsh-defer -mp -c 'source <(fzf --zsh)'
fi
'''

[plugins.gcloud]
inline = '''
# 起動ごとに `brew --prefix` を 2 回呼ぶと遅いため、.zshenv の `brew shellenv` が設定する HOMEBREW_PREFIX を使う（2026-11-25）
if [[ -n "${HOMEBREW_PREFIX}" && -d "${HOMEBREW_PREFIX}/share/google-cloud-sdk" ]]; then
  zsh-defer -mp source "${HOMEBREW_PREFIX}/share/google-cloud-sdk/completion.zsh.inc"
fi
'''

[plugins.fzf-git]
github = "junegunn/fzf-git.sh"
use = ["fzf-git.sh"]
apply = ["defer"]

[plugins.cargo]
inline = '''
export CARGO_HOME="${XDG_DATA_HOME}/cargo"
export RUSTUP_HOME="${XDG_DATA_HOME}/rustup"
if [[ -f "${CARGO_HOME}/env" ]]; then
  source "${CARGO_HOME}/env"
fi
'''

[plugins.go]
inline = '''
export GOBIN="${XDG_BIN_HOME}"
export GOMODCACHE="${XDG_CACHE_HOME}/go/mod"
export GOPATH="${XDG_DATA_HOME}/go"
'''

[plugins.zoxide]
inline = '''
if command -v zoxide &> /dev/null; then
  zsh-defer -mp -c 'eval "$(zoxide init zsh)"'
fi
'''

[plugins.kumagai]
local = "~/.zsh.d"
use = ["*.zsh"]

[plugins.local]
inline = '''
if [[ -f "${HOME}/.zshrc.local" ]]; then
  source "${HOME}/.zshrc.local"
fi
'''
